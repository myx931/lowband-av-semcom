name: Bug report
description: Report a reproducible defect in the research code.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include the command and a minimal, non-sensitive configuration.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include commit, Python, PyTorch, CUDA/device, and OS versions.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Remove credentials, private paths, dataset samples, and other sensitive data.
      render: shell
