dataset: grid
root: null  # Resolved from DATA_ROOT when unset.
raw_video_dir: grid/raw/video
raw_video_mpg_dir: grid/raw/video_mpg
raw_audio_dir: grid/raw/audio_synced
source_manifest_path: grid/manifests/grid_multispeaker.jsonl
manifest_path: grid/manifests/grid_multispeaker_synced.jsonl
failure_dir: grid/manifests/failures_multispeaker_synced
processed_dir: grid/processed/multispeaker_synced

# Preserve the E3 feasibility split while replacing only its incorrect audio source.
speakers: [s1, s2, s3]
max_samples: 100
split_seed: 42
validation_ratio: 0.1
test_ratio: 0.1

fps: 25
audio_sample_rate: 16000
image_size: 256
speaker_isolated: true
resume: true

audio_sync:
  ffmpeg_executable: ffmpeg
  workers: 8

audio:
  n_mels: 80
  window_size: 400
  hop_size: 160
  n_fft: 512
  mel_steps_per_video_frame: 4
  alignment_mode: timestamp
  minimum_duration_ratio: 0.95
  maximum_duration_ratio: 1.05

landmarks:
  backend: mediapipe
  min_detection_coverage: 0.95

face_crop:
  padding: 0.2
