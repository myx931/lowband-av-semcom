dataset: grid
root: null  # Resolved from DATA_ROOT when unset.
raw_video_dir: grid/raw/video
raw_video_mpg_dir: grid/raw/video_mpg
raw_audio_dir: grid/raw/audio_synced_10spk
manifest_path: grid/manifests/grid_ten_speaker.jsonl
failure_dir: grid/manifests/failures_ten_speaker
processed_dir: grid/processed/ten_speaker

# Feasibility-scale identity split: eight train, one validation, one test speaker.
speakers: [s1, s2, s3, s4, s5, s6, s7, s8, s9, s10]
max_samples: 100
# Clips that violate the fixed 75-frame or 95% face-coverage contract. Each is
# retained in the verified archive but skipped in favor of the next sorted clip.
excluded_sample_ids:
  - s1_bbizzn
  - s3_bgbn9a
  - s4_bbaf2a
  - s6_bgbg9n
  - s7_bbir1s
  - s7_bbir2p
  - s7_bgam9s
  - s8_bbar6a
  - s8_bbay9p
  - s8_bbie3p
  - s8_bbik5n
  - s8_bbir1p
  - s8_bbirzs
  - s8_bgag6a
  - s8_bganza
  - s8_bgim5p
  - s8_bgwa8s
split_seed: 42
validation_ratio: 0.1
test_ratio: 0.1

fps: 25
audio_sample_rate: 16000
image_size: 256
speaker_isolated: true
resume: true

frame_extraction:
  ffmpeg_executable: ffmpeg
  workers: 8
  jpeg_quality: 2
  expected_frame_count: 75

audio_sync:
  ffmpeg_executable: ffmpeg
  workers: 8

audio:
  n_mels: 80
  window_size: 400
  hop_size: 160
  n_fft: 512
  mel_steps_per_video_frame: 4
  alignment_mode: timestamp
  minimum_duration_ratio: 0.95
  maximum_duration_ratio: 1.05

landmarks:
  backend: mediapipe
  min_detection_coverage: 0.95

face_crop:
  padding: 0.2
